<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery - Energy & Sustainability Club, IIT Bombay</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header id="main-header">
        <nav>
            <div class="logo">
                <a href="index.html"> <img id="clublogo" src="assets/images/logo.png" alt="Energy Club Logo"> </a>
                <a href="https://itc.gymkhana.iitb.ac.in/" target="_blank"> <img src="assets/images/itc.png" alt="ITC Logo"> </a>
                <a href="https://iitb.ac.in" target="_blank"> <img src="assets/images/iitb.png" alt="IITB Logo"> </a>
            </div>
        </nav>
    </header>

    <main>
        <section id="media-gallery-hero" class="content-section">
            <h1 class="page-title animate-on-scroll">Media Gallery</h1>
            <p class="section-subtitle animate-on-scroll">Moments from our events, workshops, and initiatives across campus.</p>
        </section>

        <!-- RENEWATHON GALLERY -->
        <section id="renewathon" class="media-gallery-section">
            <h2 class="section-title">Renewathon</h2>
            <div class="media-grid">
                <img src="https://placehold.co/600x400/111/fff?text=Renewathon+1" alt="Renewathon 1" class="animate-on-scroll">
                <img src="https://placehold.co/600x400/222/fff?text=Renewathon+2" alt="Renewathon 2" class="animate-on-scroll">
                <img src="https://placehold.co/600x400/333/fff?text=Renewathon+3" alt="Renewathon 3" class="animate-on-scroll">
                <img src="https://placehold.co/600x400/444/fff?text=Renewathon+4" alt="Renewathon 4" class="animate-on-scroll">
            </div>
        </section>
        
        <!-- FIELD VISITS GALLERY -->
        <section id="field-visits" class="media-gallery-section">
            <h2 class="section-title">Field Visits</h2>
            <div class="media-grid">
                <img src="https://placehold.co/600x400/111/fff?text=Field+Visit+1" alt="Field Visit 1" class="animate-on-scroll">
                <img src="https://placehold.co/600x400/222/fff?text=Field+Visit+2" alt="Field Visit 2" class="animate-on-scroll">
            </div>
        </section>

        <!-- WATT'S NEXT?! GALLERY -->
        <section id="watts-next" class="media-gallery-section">
            <h2 class="section-title">Watt's Next?!</h2>
            <div class="media-grid">
                <img src="https://placehold.co/600x400/111/fff?text=Watts+Next+1" alt="Watts Next 1" class="animate-on-scroll">
                <img src="https://placehold.co/600x400/222/fff?text=Watts+Next+2" alt="Watts Next 2" class="animate-on-scroll">
                <img src="https://placehold.co/600x400/333/fff?text=Watts+Next+3" alt="Watts Next 3" class="animate-on-scroll">
            </div>
        </section>

        <!-- SUMMER SCHOOL GALLERY -->
        <section id="summer-school" class="media-gallery-section">
            <h2 class="section-title">Summer School</h2>
            <div class="media-grid">
                <img src="https://placehold.co/600x400/111/fff?text=Summer+School+1" alt="Summer School 1" class="animate-on-scroll">
            </div>
        </section>

    </main>

    <footer>...</footer>
    <a href="#" id="back-to-top" title="Back to Top">&uarr;</a>
    <script src="assets/js/main.js"></script>
</body>
</html>
